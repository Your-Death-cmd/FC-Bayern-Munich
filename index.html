<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Bayern Munich | Main Page</title>
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a href="" class="logo">
            <svg class="logo__img" role="img">
                <use href="./images/sprite.svg#fc_image"></use>
            </svg>
            <h1 class="logo__title">
                FC Bayern Munich
            </h1>
        </a>
        <nav class="menu">
            <ul class="menu__list">
                <li class="menu__item">
                    <a href="" class="anker-link anker-link--active">Home</a>
                </li>
                <li class="menu__item">
                    <a href="" class="anker-link">Team</a>
                </li>
                <li class="menu__item">
                    <a href="" class="anker-link">History</a>
                </li>
            </ul>
        </nav>
        <div class="control-button-wrapper">
            <div class="language-mod">
                <button class="language-mod__button">RU</button>
                <button class="language-mod__button">DE</button>
                <button class="language-mod__button language-mod__button--active">EN</button>
            </div>
            <button class="night-mod-button"></button>
        </div>
        <button class="burger"></button>
    </header>
</body>
</html>
